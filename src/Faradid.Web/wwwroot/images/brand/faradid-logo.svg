<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowGpu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="2" y="2" rx="98" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="180" fill="url(#glowGpu)"/>

  <!-- Radar / Telescope Outer Scope Rings -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="250" cy="250" r="95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- Compass / Crosshair Reticle -->
  <line x1="250" y1="55" x2="250" y2="90" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="250" y1="410" x2="250" y2="445" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="55" y1="250" x2="90" y2="250" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="410" y1="250" x2="445" y2="250" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- The Faradid Human Eye & Telescope Arc (Dual Vision) -->
  <path d="M 120 250 C 170 160, 330 160, 380 250 C 330 340, 170 340, 120 250 Z" 
        fill="none" stroke="url(#orbitGrad)" stroke-width="7" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Faradid Precision Iris Aperture -->
  <circle cx="250" cy="250" r="58" fill="#091328" stroke="url(#irisGrad)" stroke-width="6"/>

  <!-- Inner Pupil Lens Matrix -->
  <circle cx="250" cy="250" r="36" fill="#0f172a"/>
  
  <!-- Modern Geometric Analytical Light Rays -->
  <path d="M 250 200 L 250 216" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 285 215 L 274 226" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 300 250 L 284 250" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 285 285 L 274 274" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 250 300 L 250 284" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 285 L 226 274" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 200 250 L 216 250" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <path d="M 215 215 L 226 226" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>

  <!-- Sahand Corporate Crimson Signature Pearl Dot -->
  <circle cx="250" cy="250" r="14" fill="#e11d48"/>
  <circle cx="246" cy="246" r="4.5" fill="#ffffff" opacity="0.9"/>

  <!-- Orbiting Data Beacon Node (Dynamic Growth Signal) -->
  <circle cx="345" cy="185" r="9" fill="#10b981"/>
  <circle cx="345" cy="185" r="15" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>
</svg>
